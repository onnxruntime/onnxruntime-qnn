// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
	ext.kotlin_version = '1.6.21'

	repositories {
		google()
		mavenCentral()
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:7.4.2'
		classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
		// NOTE: Do not place your application dependencies here; they belong
		// in the individual module build.gradle files
	}
}

allprojects {
	repositories {
		google()
		mavenCentral()
		// Skipped when the caller supplies its own flatDir via --init-script
		// (e.g. build_apk_from_aar.sh passes -PskipLibsFlatDir=true).
		if (!project.hasProperty("skipLibsFlatDir")) {
			flatDir{dirs 'libs'}
		}
		// Internal Artifactory Maven repository — used when AAR_MAVEN_COORD is set
		// (post-publish APK validation in CI).  No-op in local dev builds where the
		// env var is absent.
		if (System.getenv("AAR_MAVEN_COORD")) {
			maven {
				name = "aisw-maven-virtual"
				url = "https://artifactory-qdc-global.qualcomm.com/artifactory/aisw-maven-virtual/"
				credentials {
					username = System.getenv("AISW_MAVEN_ARTIFACTORY_USERNAME") ?: ""
					password = System.getenv("AISW_MAVEN_ARTIFACTORY_PASSWORD") ?: ""
				}
			}
		}
	}
}

task clean(type: Delete) {
	delete rootProject.buildDir
}
