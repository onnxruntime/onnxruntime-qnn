plugins {
	id 'com.android.application'
	id 'kotlin-android'
}

def minSdkVer = System.properties.get("minSdkVer")?:24
def qnnVersion = System.properties['qnnVersion']
def ortVersion = System.properties['ortVersion']

android {
	compileSdkVersion 34

	defaultConfig {
		applicationId "ai.onnxruntime.example.javavalidator"
		minSdkVersion minSdkVer
		targetSdkVersion 34
		versionCode 1
		versionName "1.0"

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

		buildConfigField "boolean", "IS_QNN_BUILD", "true"
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	kotlinOptions {
		jvmTarget = '11'
	}
	packagingOptions {
		jniLibs {
			useLegacyPackaging = true
		}
	}
	sourceSets {
		main {
			manifest.srcFile 'src/main/AndroidManifestQnn.xml'
		}
	}
	namespace 'ai.onnxruntime.example.javavalidator'
}

// Resolve a Maven artifact version, falling back to a known-good version if unavailable.
// Only performs resolution when requestedVersion matches checkVersion; all other versions pass through.
def getAvailableVersion(String artifact, String requestedVersion, String checkVersion, String fallbackVersion) {
	if (requestedVersion != checkVersion) {
		return requestedVersion
	}
	try {
		configurations.detachedConfiguration(
			dependencies.create("${artifact}:${requestedVersion}")
		).resolve()
		return requestedVersion
	} catch (org.gradle.api.artifacts.ResolveException e) {
		// Only fall back when the artifact genuinely cannot be resolved (not found in any
		// configured repository). Network/TLS/credential failures must NOT be silently
		// swallowed — they would surface here with a different exception type and we want
		// them to propagate so a broken Maven mirror in CI is obvious instead of producing
		// a misleading fallback.
		logger.warn("${artifact}:${requestedVersion} not found in Maven repository (${e.class.simpleName}: ${e.message}); falling back to ${fallbackVersion}")
		return fallbackVersion
	}
}

dependencies {
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
	implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
	implementation 'androidx.core:core-ktx:1.3.2'
	implementation 'androidx.appcompat:appcompat:1.2.0'
	implementation 'com.google.android.material:material:1.3.0'
	implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
	testImplementation 'junit:junit:4.+'
	androidTestImplementation "androidx.test.ext:junit:1.1.5"
	androidTestImplementation "androidx.test.espresso:espresso-core:3.5.0"

	androidTestImplementation "androidx.test:runner:1.5.2"
	androidTestImplementation "androidx.test:rules:1.5.0"
	androidTestImplementation 'com.microsoft.appcenter:espresso-test-extension:1.4'

	// ORT core, QNN EP (includes libonnxruntime_providers_qnn.so + Kotlin helpers), and QNN runtime
	// Dynamically check and use available version from Maven repository.
	// Fallback versions (1.24.3, 2.45.0) are the previous known-good releases used when the
	// requested version is not yet available in the Maven repository (e.g., same-day CI runs).
	def resolvedOrtVersion = getAvailableVersion('com.microsoft.onnxruntime:onnxruntime-android', ortVersion, '1.24.4', '1.24.3')
	implementation "com.microsoft.onnxruntime:onnxruntime-android:${resolvedOrtVersion}"
	implementation(name: 'onnxruntime-android-qnn', ext: 'aar')
	def resolvedQnnVersion = getAvailableVersion('com.qualcomm.qti:qnn-runtime', qnnVersion, '2.45.40', '2.45.0')
	implementation "com.qualcomm.qti:qnn-runtime:${resolvedQnnVersion}"
}
