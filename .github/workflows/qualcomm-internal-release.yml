name: Publish ONNX Runtime Execution Provider

permissions:
  checks: write
  contents: read
  id-token: write

on:
  workflow_call:
    inputs: &common_inputs
      nightly_build:
        description: "If true, include a verbose version string in wheel file names."
        type: boolean
        default: true
      skip_publish_qa:
        description: "If true, don't publish QA artifacts."
        type: boolean
        default: true
      skip_publish_wheel:
        description: "If true, don't publish the Wheel."
        type: boolean
        default: true
      build_windows_arm64_debug:
        description: "If true, download and verify the Windows ARM64 Debug archive."
        type: boolean
        default: false
      build_windows_arm64_relwithdebinfo:
        description: "If true, download and verify the Windows ARM64 RelWithDebInfo archive."
        type: boolean
        default: false
      qa_tag:
        description: "Name of the build for QA purposes; leave blank to generate one based on today's date."
        type: string
        default: ''
  workflow_dispatch:
    inputs: *common_inputs

env:
  BUILD_ARTIFACTORY_REPO: "${{ secrets.BUILD_ARTIFACTORY_REPO }}"

jobs:
  build-artifacts:
    uses: ./.github/workflows/qualcomm-internal-build-artifacts.yml
    secrets: inherit
    with:
      nightly_build: ${{inputs.nightly_build}}
      build_android_aarch64: true
      build_android_aarch64_aar: true
      build_linux_aarch64_oe_gcc11_2: true
      build_linux_x86_64: true
      linux_x86_64_target_py_vsns: "['3.10','3.12']"
      linux_target_py_vsns: "['3.11','3.12','3.13','3.14']"
      windows_target_archs: "['arm64', 'arm64ec', 'x86_64']"
      windows_target_py_vsns: "['3.11','3.12','3.13','3.14']"
      windows_arm64_build_archive: true
      build_windows_arm64_debug: ${{ inputs.build_windows_arm64_debug }}
      build_windows_arm64_relwithdebinfo: ${{ inputs.build_windows_arm64_relwithdebinfo }}

  publish-wheel-workflow:
    name: "Publish distribution to PyPI"
    runs-on: [Linux, self-hosted, Build]
    needs: [build-artifacts]

    steps:
      - uses: actions/checkout@v6

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      # We only publish this for AI Hub to use and they only want x86_64 Linux
      - name: Download Linux x86_64 Python 3.10 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64-py3.10-wheels

      - name: Download Linux x86_64 Python 3.12 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64-py3.12-wheels

      - name: Consolidate Wheels
        run: |
          mkdir "${{ github.workspace }}/build/dist"
          cp "${{ github.workspace }}/build/linux-x86_64/Release/dist/"*.whl "${{ github.workspace }}/build/dist"

      - name: Create config file
        run: |
          echo "[distutils]" > build/pypirc
          echo "index-servers = local" >> build/pypirc
          echo "[local]" >> build/pypirc
          echo "repository: http://ort-ep-win-01.na.qualcomm.com:8080" >> build/pypirc
          echo "username = OrtQnnEpUploader" >> build/pypirc
          echo "password = ${{ secrets.UPLOADER_PASSWORD }}" >> build/pypirc

      - name: Install Dependencies
        run: |
          python3 -m venv venv
          # Pin twine <6.2.0: 6.2.0 dropped --skip-existing for non-Warehouse
          # indexes (the internal pypiserver at ort-ep-win-01), causing
          # `UnsupportedConfiguration` on upload.
          source venv/bin/activate && pip3 install 'twine<6.2.0'

      - name: Check wheel
        run: |
          source venv/bin/activate && twine check ${{ github.workspace }}/build/dist/*

      - name: Publish
        if: ${{ !inputs.skip_publish_wheel }}
        run: |
          source venv/bin/activate && twine upload --skip-existing --config-file=build/pypirc -r local ${{ github.workspace }}/build/dist/*

  publish-qa-artifacts:
    name: "Publish QA artifacts to Artifactory"
    runs-on: [Linux, self-hosted, Build]
    needs: [build-artifacts]

    steps:
      - uses: actions/checkout@v6

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      # ---------------
      # Download wheels
      # ---------------

      - name: Download Linux x86_64 Python 3.10 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64-py3.10-wheels

      - name: Download Linux x86_64 Python 3.12 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64-py3.12-wheels

      - name: Download Linux Aarch64 manylinux_2_34 Python 3.11 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_manylinux_2_34-py3.11-wheels

      - name: Download Linux Aarch64 manylinux_2_34 Python 3.12 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_manylinux_2_34-py3.12-wheels

      - name: Download Linux Aarch64 manylinux_2_34 Python 3.13 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_manylinux_2_34-py3.13-wheels

      - name: Download Linux Aarch64 manylinux_2_34 Python 3.14 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_manylinux_2_34-py3.14-wheels

      - name: Download Linux x86_64 Ubuntu 22.04 Python 3.11 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64_ubuntu_22_04-py3.11-wheels

      - name: Download Linux x86_64 Ubuntu 22.04 Python 3.12 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64_ubuntu_22_04-py3.12-wheels

      - name: Download Linux x86_64 Ubuntu 22.04 Python 3.13 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64_ubuntu_22_04-py3.13-wheels

      - name: Download Linux x86_64 Ubuntu 22.04 Python 3.14 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64_ubuntu_22_04-py3.14-wheels

      - name: Download Windows ARM64 Python 3.11 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.11-wheels

      - name: Download Windows ARM64 Python 3.12 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.12-wheels

      - name: Download Windows ARM64 Python 3.13 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.13-wheels

      - name: Download Windows ARM64 Python 3.14 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.14-wheels

      - name: Download Windows ARM64EC Python 3.11 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64ec-py3.11-wheels

      - name: Download Windows ARM64EC Python 3.12 from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64ec-py3.12-wheels

      - name: Download Windows ARM64EC Python 3.13 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64ec-py3.13-wheels

      - name: Download Windows ARM64EC Python 3.14 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64ec-py3.14-wheels

      - name: Download Windows x86_64 Python 3.11 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-x86_64-py3.11-wheels

      - name: Download Windows x86_64 Python 3.12 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-x86_64-py3.12-wheels

      - name: Download Windows x86_64 Python 3.13 Wheel from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-x86_64-py3.13-wheels

      - name: Download Windows x86_64 Python 3.14 from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-x86_64-py3.14-wheels

      # ----------------------
      # Download test archives
      # ----------------------

      - name: Download Linux Aarch64 manylinux_2_34 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_manylinux_2_34-py3.11-tests

      - name: Download Linux x86_64 Ubuntu 22.04 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64_ubuntu_22_04-py3.11-tests

      - name: Download Android Aarch64 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: android-aarch64-pyNone-tests

      - name: Download Linux Aarch64 OE GCC 11.2 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_oe_gcc11_2-pyNone-tests

      - name: Download Linux x86_64 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64-py3.10-tests

      - name: Download Windows ARM64 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.11-tests

      - name: Download Windows ARM64EC Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64ec-py3.11-tests

      - name: Download Windows x86_64 Tests from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-x86_64-py3.11-tests

      # --------------------------
      # Download testdata archives
      # --------------------------

      - name: Download testdata zip from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: testdata-zip

      - name: Download testdata tar.bz2 from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: testdata-tarbz2

      # -----------------------------
      # Download other distributables
      # -----------------------------

      - name: Download Android AAR from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: android-aarch64-aar

      - name: Download Android POM from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: android-aarch64-pom

      - name: Download Windows ARM64 (ARM64x) NuGet Package from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64x-py3.11-nuget

      - name: Download Windows ARM64 Zip Package from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.11-zip

      - name: Download Windows ARM64 (ARM64x) Zip from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64x-py3.11-zip

      - name: Download Windows ARM64 Debug Zip Package from Artifactory
        if: ${{ inputs.build_windows_arm64_debug }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.11-Debug-zip

      - name: Download Windows ARM64 RelWithDebInfo Zip Package from Artifactory
        if: ${{ inputs.build_windows_arm64_relwithdebinfo }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.11-RelWithDebInfo-zip

      - name: Download Windows ARM64 PDB Archive from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64-py3.11-pdb-zip

      - name: Download Windows ARM64EC PDB Archive from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64ec-py3.11-pdb-zip

      - name: Download Windows x86_64 PDB Archive from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-x86_64-py3.11-pdb-zip

      - name: Download Windows ARM64 (ARM64x) PDB Archive from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: windows-arm64x-py3.11-pdb-zip

      - name: Download Linux Aarch64 manylinux_2_34 TGZ Package from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-aarch64_manylinux_2_34-py3.11-tgz

      - name: Download Linux x86_64 Ubuntu 22.04 TGZ Package from Artifactory
        uses: ./.github/actions/download-ci-artifact
        with:
          name: linux-x86_64_ubuntu_22_04-py3.11-tgz

      - name: Merge AMD Wheels
        run: |
          # Collect the ARM64ec and x86_64 wheels into known locations
          mkdir -p "${{ github.workspace }}/build/dist/x86_64" "${{ github.workspace }}/build/dist/arm64ec"
          find "${{ github.workspace }}/build/windows-arm64ec" -name "*.whl" -exec cp '{}' "${{ github.workspace }}/build/dist/arm64ec" ';'
          find "${{ github.workspace }}/build/windows-x86_64" -name "*.whl" -exec cp '{}' "${{ github.workspace }}/build/dist/x86_64" ';'

          # Merge the wheels
          ${{ github.workspace }}/qcom/scripts/upleveling/create_uplevel_venv.sh
          source ${{ github.workspace }}/uplevel_venv/bin/activate
          ${{ github.workspace }}/qcom/scripts/upleveling/merge_wheels.sh \
            "${{ github.workspace }}/build/dist/x86_64" \
            "${{ github.workspace }}/build/dist/arm64ec" \
            "${{ github.workspace }}/build/dist"

          # Purge the un-merged wheels
          rm -fr "${{ github.workspace }}/build/dist/x86_64/" "${{ github.workspace }}/build/dist/arm64ec/"
          find "${{ github.workspace }}/build/windows-arm64ec" -name "*.whl" -delete
          find "${{ github.workspace }}/build/windows-x86_64" -name "*.whl" -delete

      - name: Verify Wheel artifacts
        run: |
          # After merge: 2 Linux x86_64 (py3.10, py3.12) + 4 Linux Aarch64 manylinux_2_34 + 4 Linux x86_64 Ubuntu 22.04 + 4 Windows ARM64 + 4 merged AMD = 18 wheels
          # (arm64ec and x86_64 originals are deleted by the merge step above)
          count=$(find "${{ github.workspace }}/build" -name "*.whl" | wc -l)
          echo "Found $count wheel(s)"
          [ "$count" -eq 18 ] || { echo "ERROR: Expected 18 wheels, found $count"; exit 1; }

      - name: Verify NuGet artifact
        run: |
          count=$(find "${{ github.workspace }}/build" -name "*.nupkg" | wc -l)
          echo "Found $count NuGet package(s)"
          [ "$count" -eq 1 ] || { echo "ERROR: Expected 1 NuGet package, found $count"; exit 1; }

      - name: Verify tarball artifacts
        run: |
          # Expected .tar.bz2 artifacts. Append its glob here for a new one.
          expected=(
            "onnxruntime-tests-linux-aarch64_manylinux_2_34.tar.bz2"
            "onnxruntime-tests-linux-x86_64_ubuntu_22_04.tar.bz2"
            "onnxruntime-tests-linux-aarch64_oe_gcc11_2.tar.bz2"
            "onnxruntime-tests-linux-x86_64.tar.bz2"
            "onnxruntime-testdata.tar.bz2"
          )
          missing=()
          for pattern in "${expected[@]}"; do
            if ! find "${{ github.workspace }}/build" -type f -name "$pattern" | grep -q .; then
              missing+=("$pattern")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "ERROR: missing .tar.bz2 artifacts:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          actual_count=$(find "${{ github.workspace }}/build" -type f -name "*.tar.bz2" | wc -l)
          if [ "$actual_count" -ne "${#expected[@]}" ]; then
            echo "ERROR: expected ${#expected[@]} .tar.bz2 archive(s), found $actual_count. Inventory:"
            find "${{ github.workspace }}/build" -type f -name "*.tar.bz2"
            exit 1
          fi
          echo "Found ${#expected[@]} expected .tar.bz2 archive(s)."

      - name: Verify Zip artifacts
        run: |
          # Expected .zip artifacts. Append its glob here for a new one.
          # Versioned distributable + PDB zips use 'onnxruntime-qnn-<version>-win-<arch>{-pdb}.zip'.
          expected=(
            "onnxruntime-tests-android-aarch64.zip"
            "onnxruntime-tests-windows-arm64.zip"
            "onnxruntime-tests-windows-arm64ec.zip"
            "onnxruntime-tests-windows-x86_64.zip"
            "onnxruntime-testdata.zip"
            "onnxruntime-qnn-*-win-arm64.zip"
            "onnxruntime-qnn-*-win-arm64x.zip"
            "onnxruntime-qnn-*-win-arm64-pdb.zip"
            "onnxruntime-qnn-*-win-arm64ec-pdb.zip"
            "onnxruntime-qnn-*-win-x64-pdb.zip"
            "onnxruntime-qnn-*-win-arm64x-pdb.zip"
          )
          extra_zip_count=0
          [ "${{ inputs.build_windows_arm64_debug }}" = "true" ] && extra_zip_count=$((extra_zip_count + 1))
          [ "${{ inputs.build_windows_arm64_relwithdebinfo }}" = "true" ] && extra_zip_count=$((extra_zip_count + 1))
          missing=()
          for pattern in "${expected[@]}"; do
            if ! find "${{ github.workspace }}/build" -type f -name "$pattern" | grep -q .; then
              missing+=("$pattern")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "ERROR: missing .zip artifacts:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          actual_count=$(find "${{ github.workspace }}/build" -type f -name "*.zip" | wc -l)
          expected_count=$((${#expected[@]} + extra_zip_count))
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "ERROR: expected $expected_count Zip archive(s), found $actual_count. Inventory:"
            find "${{ github.workspace }}/build" -type f -name "*.zip"
            exit 1
          fi
          echo "Found $expected_count expected Zip archive(s)."

      - name: Verify TGZ artifact
        run: |
          count=$(find "${{ github.workspace }}/build" -name "*.tgz" | wc -l)
          echo "Found $count TGZ archive(s)"
          [ "$count" -eq 2 ] || { echo "ERROR: Expected 2 TGZ archive, found $count"; exit 1; }

      - name: Verify AAR artifact
        run: |
          count=$(find "${{ github.workspace }}/build" -name "*.aar" | wc -l)
          echo "Found $count AAR package(s)"
          [ "$count" -eq 1 ] || { echo "ERROR: Expected 1 AAR package, found $count"; exit 1; }

      - name: Verify POM artifact
        run: |
          count=$(find "${{ github.workspace }}/build" -name "*.pom" | wc -l)
          echo "Found $count POM package(s)"
          [ "$count" -eq 1 ] || { echo "ERROR: Expected 1 POM package, found $count"; exit 1; }

      - name: Set QA Build Tag
        run: |
          if [ -z "${{ inputs.qa_tag }}" ]; then
            echo "QA_TAG=nightly-$(date --rfc-3339=date)-${GITHUB_SHA:0:10}" >> ${GITHUB_ENV}
          else
            echo "QA_TAG=${{ inputs.qa_tag }}" >> ${GITHUB_ENV}
          fi

      - name: Collect Test Archives
        # cp (not mv): archives must remain in build/ so the Upload Artifacts to QA Artifactory
        # step below also publishes them individually alongside the combined test_package.zip.
        run: |
          TEST_ARCHIVES_DIR="${{ github.workspace }}/test_archives"
          if [ -d "$TEST_ARCHIVES_DIR" ]; then
            echo "Folder already exists: $TEST_ARCHIVES_DIR"
          else
            mkdir -p "$TEST_ARCHIVES_DIR"
          fi
          find "${{ github.workspace }}/build" -type f -name "onnxruntime-tests-*" \
            -exec cp {} "$TEST_ARCHIVES_DIR/" \;

      - name: Prepare Test Package Archive
        run: |
          ./qcom/scripts/all/prepare_test_package.sh \
            "${{ github.workspace }}/test_archives" \
            "${{ github.workspace }}/build" \
            "${{ env.QA_TAG }}"

      - name: Upload Artifacts to QA Artifactory
        if: ${{ !inputs.skip_publish_qa }}
        uses: ./.github/actions/upload-qa-artifact
        with:
          src_pattern: "*.*"
          qa_tag: ${{ env.QA_TAG }}
