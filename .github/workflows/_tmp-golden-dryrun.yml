#
# TEMPORARY — DELETE BEFORE MERGE.
#
# Pre-merge sanity check for the golden pipeline. On every push to the PR2
# branch, run golden-publish in DRY-RUN so the shared golden store is not
# updated, upload the packaged goldens.zip as a downloadable GitHub artifact,
# and temporarily validate an Artifactory upload/download round trip through
# ci/qnn-golden-validation/<run-id>/goldens.zip.
#
# We pass dry_run + filter EXPLICITLY here. A push event has no `inputs`
# context, so calling golden-publish.yml directly from a push trigger would
# leave inputs.dry_run empty and fall through to --publish. This wrapper is the
# safe way to force dry-run on push.

name: TEMP Golden Dry-Run (PR2)

# Must match/exceed what the reusable golden-publish.yml requests, else the
# reusable call fails at startup (callee permissions can't exceed caller's).
permissions:
  contents: read
  checks: write

on:
  push:
    branches:
      - dev/yuhuchua/qnn-ut-golden-publish

jobs:
  dryrun:
    uses: ./.github/workflows/qualcomm-internal-golden-publish.yml
    secrets: inherit
    with:
      dry_run: true
      filter: Clip
      keep_zip_artifact: true
      temp_artifactory_validation_upload: true
