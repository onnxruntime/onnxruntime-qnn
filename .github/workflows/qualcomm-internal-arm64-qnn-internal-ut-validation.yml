name: Qualcomm Internal ARM64 QNN Internal-UT Validation

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      reuse_build_run:
        description: "Reuse test inputs from a previous validation run instead of rebuilding"
        type: string
        default: ""
      diagnostics_only:
        description: "Run only the standalone case and capture its crash stack on failure"
        type: boolean
        default: false
      rebuild_provider:
        description: "Rebuild only QNN EP and use it with the unchanged prebuilt tests"
        type: boolean
        default: false

jobs:
  build-linux-arm64:
    if: ${{ inputs.reuse_build_run == '' || inputs.rebuild_provider }}
    runs-on: [self-hosted, X64, Linux, Build]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Enable internal symbols in this disposable validation checkout
        shell: bash
        env:
          QNN_PROVIDER_ONLY: ${{ inputs.rebuild_provider && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("qcom/scripts/linux/build.sh")
          text = path.read_text()
          needle = "enable_qnn_internal_test_symbols=\n"
          if text.count(needle) != 1:
              raise SystemExit("Could not locate the internal-symbol build default")
          path.write_text(text.replace(needle, "enable_qnn_internal_test_symbols=1\n", 1))
          if os.environ["QNN_PROVIDER_ONLY"] == "1":
              text = path.read_text()
              needle = '"${package_args[@]}"'
              if text.count(needle) != 1:
                  raise SystemExit("Could not locate the CMake build invocation")
              path.write_text(text.replace(needle, needle + ' --targets onnxruntime_providers_qnn', 1))

          path = Path("qcom/ep_build/tasks/build.py")
          text = path.read_text()
          needle = 'venv_path=DOCKER_REPO_ROOT / "build" / "venv.build",'
          if text.count(needle) != 1:
              raise SystemExit("Could not locate the manylinux build venv")
          path.write_text(text.replace(needle, 'venv_path=Path("/ort_caches/packages/internal-ut-venv.build"),', 1))
          PY
      - name: Build and archive Linux ARM64 internal-symbol tests
        shell: bash
        env:
          QNN_PROVIDER_ONLY: ${{ inputs.rebuild_provider && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 qcom/build_and_test.py --target-py-version None build_ort_linux_aarch64_manylinux_2_34
          if [ "${QNN_PROVIDER_ONLY}" = "1" ]; then
            test -f build/linux-aarch64_manylinux_2_34/Release/libonnxruntime_providers_qnn.so
            exit 0
          fi
          python3 qcom/build_and_test.py --target-py-version None \
            create_venv archive_ort_linux_aarch64_manylinux_2_34 archive_testdata --only
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.rebuild_provider }}
        with:
          name: qnn-test-only-init-linux-arm64-inputs
          path: |
            build/onnxruntime-tests-linux-aarch64_manylinux_2_34.tar.bz2
            build/onnxruntime-testdata.tar.bz2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.rebuild_provider }}
        with:
          name: qnn-rebuilt-provider
          path: build/linux-aarch64_manylinux_2_34/Release/libonnxruntime_providers_qnn.so
          if-no-files-found: error

  test-linux-arm64:
    needs: build-linux-arm64
    if: ${{ always() && !cancelled() && (needs.build-linux-arm64.result == 'success' || (inputs.reuse_build_run != '' && !inputs.rebuild_provider)) }}
    runs-on: [self-hosted, ARM64, Linux, Test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: qnn-test-only-init-linux-arm64-inputs
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_build_run || github.run_id }}
      - name: Extract test archives
        shell: bash
        run: |
          set -euo pipefail
          python3 qcom/build_and_test.py --target-py-version None \
            create_venv extract_ort_linux_aarch64_manylinux_2_34 --only
      - uses: actions/download-artifact@v4
        if: ${{ inputs.rebuild_provider }}
        with:
          name: qnn-rebuilt-provider
          path: rebuilt-provider
      - name: Replace only the QNN shared library for this validation
        if: ${{ inputs.rebuild_provider }}
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(find build/linux-aarch64_manylinux_2_34/Release -type f -name onnxruntime_provider_test -print -quit)"
          test -n "${test_bin}"
          cp rebuilt-provider/libonnxruntime_providers_qnn.so "$(dirname "${test_bin}")/libonnxruntime_providers_qnn.so"
      - name: Validate standalone invalid-path and shuffled unit, integration, and legacy tests
        shell: bash
        env:
          QNN_DIAGNOSTICS_ONLY: ${{ inputs.diagnostics_only && '1' || '0' }}
        run: |
          set -euo pipefail
          ulimit -c 0
          results_dir="${GITHUB_WORKSPACE}/test-only-init-results"
          mkdir -p "${results_dir}"
          test_bin="$(find build/linux-aarch64_manylinux_2_34/Release -type f -name onnxruntime_provider_test -print -quit)"
          test -n "${test_bin}" || { echo "onnxruntime_provider_test not found"; exit 1; }
          test_bin="$(realpath "${test_bin}")"
          test_dir="$(dirname "${test_bin}")"
          export LD_LIBRARY_PATH="${test_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cd "${test_dir}"
          # Exercise test_main's own setup, without a CI-provided ADSP path.
          unset ADSP_LIBRARY_PATH
          failures=0
          filter='QnnUnit_BackendManagerTest.SetupBackend_InvalidPath_ReturnsError'
          "${test_bin}" --gtest_list_tests "--gtest_filter=${filter}" | tee "${results_dir}/invalid-path-inventory.txt"
          grep -q SetupBackend_InvalidPath_ReturnsError "${results_dir}/invalid-path-inventory.txt"
          if ! timeout 5m "${test_bin}" "--gtest_filter=${filter}" \
            "--gtest_output=xml:${results_dir}/invalid-path.xml" 2>&1 | tee "${results_dir}/invalid-path.log"; then
            # Stop on a startup/standalone regression; preserve its log instead
            # of running the full device suite with invalid initialization.
            if [ "${QNN_DIAGNOSTICS_ONLY}" = "1" ]; then
              if command -v gdb >/dev/null 2>&1; then
                timeout 2m gdb -q -batch \
                  -ex 'set pagination off' -ex run -ex 'bt 12' \
                  -ex 'info registers x0 x1 pc' \
                  --args "${test_bin}" "--gtest_filter=${filter}" \
                  2>&1 | tee "${results_dir}/gdb-backtrace.log" || true
              else
                echo 'gdb is not installed on this test runner' | tee "${results_dir}/gdb-backtrace.log"
                # Diagnostic-only signal tracer: reuse the failed binary and
                # record its native stack without changing logger state.
                if command -v cc >/dev/null 2>&1; then
                  cat > "${results_dir}/crash-stack.c" <<'C'
          #define _GNU_SOURCE
          #include <execinfo.h>
          #include <signal.h>
          #include <stdio.h>
          #include <ucontext.h>
          #include <unistd.h>

          static void trace_crash(int sig, siginfo_t* info, void* context) {
            void* frames[24];
            dprintf(STDERR_FILENO, "signal=%d fault_address=%p\n", sig, info->si_addr);
          #if defined(__aarch64__)
            const ucontext_t* state = (const ucontext_t*)context;
            dprintf(STDERR_FILENO, "pc=%llx x0=%llx x1=%llx\n",
                    (unsigned long long)state->uc_mcontext.pc,
                    (unsigned long long)state->uc_mcontext.regs[0],
                    (unsigned long long)state->uc_mcontext.regs[1]);
          #else
            (void)context;
          #endif
            backtrace_symbols_fd(frames, backtrace(frames, 24), STDERR_FILENO);
            _exit(128 + sig);
          }

          __attribute__((constructor)) static void install_trace(void) {
            struct sigaction action = {0};
            action.sa_sigaction = trace_crash;
            action.sa_flags = SA_SIGINFO;
            sigemptyset(&action.sa_mask);
            sigaction(SIGSEGV, &action, NULL);
          }
          C
                  cc -shared -fPIC -O0 -g -o "${results_dir}/crash-stack.so" "${results_dir}/crash-stack.c"
                  LD_PRELOAD="${results_dir}/crash-stack.so" timeout 2m "${test_bin}" "--gtest_filter=${filter}" \
                    2>&1 | tee "${results_dir}/native-backtrace.log" || true
                else
                  echo 'No C compiler is installed; native stack unavailable' | tee "${results_dir}/native-backtrace.log"
                fi
              fi
            fi
            exit 1
          fi
          if [ "${QNN_DIAGNOSTICS_ONLY}" = "1" ]; then
            exit 0
          fi
          "${test_bin}" --gtest_list_tests '--gtest_filter=QnnUnit_*:QnnInteg_*' | tee "${results_dir}/tier-inventory.txt"
          # Retain the regular CI Accuracy exclusion; include all component,
          # snapshot, integration, and legacy registrations in this run.
          if ! timeout 45m "${test_bin}" '--gtest_filter=-QnnAcc_*' \
            --gtest_shuffle --gtest_random_seed=861 \
            "--gtest_output=xml:${results_dir}/full.xml" 2>&1 | tee "${results_dir}/full.log"; then
            failures=1
          fi
          exit "${failures}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qnn-test-only-init-linux-arm64-results
          path: test-only-init-results
          if-no-files-found: warn
