name: Qualcomm Internal ASan

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  asan-linux-x86_64:
    name: "asan-linux-x86_64"
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    # Run ASan in non-blocking mode: the job's red X / log are still
    # surfaced in the PR checks UI for human review, but a failure does
    # not gate merge. ASan is a heuristic detector — it can flag
    # third-party noise (stripped libQnn*.so init leaks, UDO op-package
    # `<unknown module>` Direct leaks, transient LSan tracer SIGSEGVs)
    # that are out of our control, and we don't want unrelated PRs
    # blocked while we triage. Real ORT-side regressions are still
    # visible; reviewers should glance at the ASan check before merging.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules omitted here; initialized below only when ASan is needed.

      - name: Check if ASan is needed
        id: gate
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_ref="${{ github.base_ref }}"
          if [ -z "${base_ref}" ]; then
            echo "::error::github.base_ref is empty (event_name=${{ github.event_name }})"
            exit 1
          fi

          if ! changed=$(git diff --name-only "origin/${base_ref}...HEAD"); then
            echo "::error::git diff against origin/${base_ref}...HEAD failed"
            exit 1
          fi

          # Trigger ASan when QNN EP source/test code changes, or when the
          # ASan pipeline files themselves change so pipeline edits don't
          # land unvalidated (chicken-and-egg with the gate itself).
          if echo "${changed}" | grep -qE \
              -e 'onnxruntime/(core|test)/providers/qnn/' \
              -e '^\.github/workflows/qualcomm-internal-asan\.yml$' \
              -e '^qcom/scripts/linux/(run_asan|asan_filter_leaks)\.sh$' \
              -e '^tools/ci_build/lsan_suppressions\.txt$'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Initialize submodules
        if: steps.gate.outputs.run == 'true'
        run: git submodule update --init --recursive

      - name: Run ASan build and unit tests (Linux x86_64, Debug)
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 qcom/build_and_test.py \
            --target-py-version None \
            asan_linux_x86_64
