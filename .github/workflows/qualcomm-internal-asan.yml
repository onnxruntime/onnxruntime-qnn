name: Qualcomm Internal ASan

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  asan-linux-x86_64:
    name: "asan-linux-x86_64"
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # submodules omitted here; initialized below only when ASan is needed.
      # The post step removes the checkout's Git data regardless of job result.
      - uses: ./.github/actions/cleanup-git-history

      - name: Check if ASan is needed
        id: gate
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base_ref="${{ github.base_ref }}"
          if [ -z "${base_ref}" ]; then
            echo "::error::github.base_ref is empty (event_name=${{ github.event_name }})"
            exit 1
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base_sha}" ]; then
            echo "::error::pull_request.base.sha is empty (base_ref=${base_ref})"
            exit 1
          fi

          # Fetch only the PR target-branch snapshot, not every remote branch and tag.
          git fetch --no-tags --depth=1 origin "${base_sha}"
          if ! changed=$(git diff --name-only "${base_sha}" HEAD); then
            echo "::error::git diff against ${base_ref} (${base_sha}) failed"
            exit 1
          fi

          # Trigger ASan when QNN EP source/test code changes, or when the
          # ASan pipeline files themselves change so pipeline edits don't
          # land unvalidated (chicken-and-egg with the gate itself).
          if echo "${changed}" | grep -qE \
              -e 'onnxruntime/(core|test)/providers/qnn/' \
              -e '^\.github/workflows/qualcomm-internal-asan\.yml$' \
              -e '^qcom/scripts/linux/(run_asan|asan_filter_leaks)\.sh$' \
              -e '^tools/ci_build/lsan_suppressions\.txt$'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Initialize submodules
        if: steps.gate.outputs.run == 'true'
        run: git submodule update --init --recursive

      - name: Run ASan build and unit tests (Linux x86_64, Debug)
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 qcom/build_and_test.py \
            --target-py-version None \
            asan_linux_x86_64
