name: Scheduled Publish of ONNX Runtime Execution Provider

permissions:
  checks: write
  contents: read
  id-token: write

on:
  schedule:
    - cron: "0 9 * * *"  # Every day at 2am in San Diego/PDT (9am UTC)

jobs:
  setup:
    name: Compute Shared QA Tag
    runs-on: [Linux, self-hosted]
    outputs:
      qa_tag: ${{ steps.t.outputs.qa_tag }}
    steps:
      - id: t
        # Compute the QA tag once so all downstream jobs (publish-artifacts + coverage)
        # upload to the exact same Artifactory directory. Same format as
        # qualcomm-internal-release.yml's auto-compute fallback.
        run: echo "qa_tag=nightly-$(date --rfc-3339=date)-${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"

  publish-artifacts:
    name: Publish Artifacts
    needs: setup
    uses: ./.github/workflows/qualcomm-internal-release.yml
    secrets: inherit
    with:
      nightly_build: true
      skip_publish_qa: false
      skip_publish_wheel: false
      build_windows_arm64_debug: true
      build_windows_arm64_relwithdebinfo: true
      qa_tag: ${{ needs.setup.outputs.qa_tag }}

  coverage:
    name: Per-File Coverage Tracking
    needs: setup
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/qualcomm-internal-coverage.yml
    secrets: inherit
    with:
      nightly_coverage: true
      qa_tag: ${{ needs.setup.outputs.qa_tag }}

  golden-publish:
    name: Publish ${{ matrix.platform }} Snapshot Golden Files
    needs: setup
    if: ${{ success() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            golden_profile: linux-x86_64-htp-simulator
            runner_labels: '["self-hosted", "X64", "Linux", "Build"]'
            build_task: build_ort_linux_x86_64_internal_symbols
            build_dir: build/linux-x86_64-internal-symbols
            build_config: Release
            python_executable: python3
          - platform: Windows x86_64
            golden_profile: windows-x86_64-htp-simulator
            runner_labels: '["self-hosted", "X64", "Windows", "Build"]'
            build_task: build_ort_windows_x86_64_internal_symbols
            build_dir: build/windows-x86_64-internal-symbols
            build_config: Release
            python_executable: python.exe
          - platform: Windows ARM64 v73
            golden_profile: windows-arm64-htp-v73
            runner_labels: '["self-hosted", "ARM64", "Windows", "Build"]'
            build_task: build_ort_windows_arm64_internal_symbols
            build_dir: build/windows-arm64-internal-symbols
            build_config: Release
            python_executable: python.exe
          - platform: Linux ARM64 v68
            golden_profile: linux-arm64-htp-v68
            runner_labels: '["self-hosted", "ARM64", "Linux", "Build"]'
            build_task: build_ort_linux_aarch64_manylinux_2_34_internal_symbols
            build_dir: build/linux-aarch64_manylinux_2_34-internal-symbols
            build_config: Release
            python_executable: python3
    uses: ./.github/workflows/qualcomm-internal-snapshot-golden-publish.yml
    secrets: inherit
    with:
      # Scheduled producer explicitly opts into the real upload; the reusable
      # workflow defaults dry_run=true so manual dispatches stay safe.
      dry_run: false
      golden_profile: ${{ matrix.golden_profile }}
      runner_labels: ${{ matrix.runner_labels }}
      build_task: ${{ matrix.build_task }}
      build_dir: ${{ matrix.build_dir }}
      build_config: ${{ matrix.build_config }}
      python_executable: ${{ matrix.python_executable }}
