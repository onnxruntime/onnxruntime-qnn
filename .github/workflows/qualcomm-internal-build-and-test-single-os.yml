name: Qualcomm Internal Single OS Build

permissions:
  contents: read
  checks: write

on:
  workflow_call:
    inputs: &common_inputs
      has_code_changes:
        description: |
          If false, the job runs checkout + (skipped) steps only and skips ALL heavy work
          (submodule init, build, tests, uploads), reporting success so required status checks
          stay green on PRs that don't touch code. Defaults to true so release callers
          (build-artifacts.yml) and direct workflow_dispatch are unaffected.
        default: true
        type: boolean
      target_os:
        description: "The OS for which to build: windows or linux"
        default: windows
        type: string
      target_arch:
        description: |
          The architecture for which to build.
          [Linux] aarch64_manylinux_2_34, aarch64_oe_gcc11_2, x86_64, or x86_64_ubuntu_22_04.
          [Windows] arm64, arm64ec, arm64x, or x86_64.
        default: arm64
        type: string
      target_py_vsn:
        description: "Build a wheel for this version of Python (3.11, 3.12, 3.13, 3.14, None)"
        default: "3.12"
        type: string
      nightly_build:
        description: "If true, include a verbose version string in wheel file names."
        type: boolean
        default: true
      build_config:
        description: "Specify the type of build: Debug, Release, or RelWithDebInfo."
        default: "Release"
        type: string
      qnn_internal_test_symbols:
        description: "Enable QNN EP internal test symbols for supported targets. Test archives are not supported in this mode."
        default: false
        type: boolean
      version_suffix:
        description: "Version suffix. If set, the specified suffix will be appended to the version string."
        type: string
        default: ""
      build_runner_os:
        description: "The OS of the build machine to use. Leave blank to use target_os."
        type: string
        default: ""
      build_runner_arch:
        description: "The architecture of the build machine to use. X64 Windows are faster, but ARM64 can produce ARM64 wheels."
        default: "X64"
        type: string
      build_test_same_runner:
        description: "If true, run tests on the same runner that built them."
        default: true
        type: boolean
      test_runner_arch:
        description: "The architecture of the test machine to use: X64 or (Windows only) ARM64."
        default: "X64"
        type: string
      run_tests:
        description: "If true, also run unit tests"
        default: true
        type: boolean
      test_wheel:
        description: "If true, also run a smoke test on the wheel."
        default: false
        type: boolean
      upload_test_archive:
        description: "If true, build a test archive and include is as an artifact."
        default: false
        type: boolean
      upload_wheel:
        description: "If true, include the wheel as a workflow artifact."
        default: true
        type: boolean
      build_nuget:
        default: false
        type: boolean
      upload_nuget:
        default: false
        type: boolean
      build_archive:
        default: false
        type: boolean
      upload_archive:
        default: false
        type: boolean
      build_pdb_archive:
        description: "If true (Windows only), build an archive containing just the PDB debug symbols."
        default: false
        type: boolean
      upload_pdb_archive:
        description: "If true, upload the PDB archive as a CI artifact."
        default: false
        type: boolean
      testdata_archive_artifact_name:
        description: |
          Artifact name to download as the testdata archive in the test step.
          Empty disables the download.
        type: string
        default: ""
      build_aar:
        description: |
          If true, also build the Android AAR during the Android build.
          Must be set together with upload_aar (the two inputs are always coupled;
          setting only one is a configuration error).
        default: false
        type: boolean
      upload_aar:
        description: |
          If true, upload the Android AAR (and its POM sidecar) as CI artifacts.
          Must be set together with build_aar (see build_aar's description).
        default: false
        type: boolean
  workflow_dispatch:
    inputs: *common_inputs

env:
  ORT_NIGHTLY_BUILD: "${{ inputs.nightly_build == true && '1' || '0' }}"

  # Cross compilation on Windows adds a folder to the build directory.
  BUILD_CONFIG_DIR: "${{ (inputs.target_os == 'windows' && ((inputs.build_runner_arch == 'X64' && inputs.target_arch != 'x86_64') || (inputs.build_runner_arch == 'ARM64' && inputs.target_arch != 'arm64'))) && format('{0}/{0}', inputs.build_config) || inputs.build_config }}"

  # Internal-symbol builds are intentionally isolated from shipping build directories.
  BUILD_DIR_ARCH: "${{ inputs.qnn_internal_test_symbols && format('{0}-internal-symbols', inputs.target_arch) || inputs.target_arch }}"

  TEST_ARCHIVE_EXT: "${{ inputs.target_os == 'linux' && 'tar.bz2' || 'zip' }}"

  ORT_VERSION_SUFFIX: "${{ inputs.version_suffix != '' && inputs.version_suffix || '' }}"
  SNAPSHOT_GOLDEN_PROFILE: "${{ inputs.target_os == 'windows' && inputs.target_arch == 'x86_64' && inputs.qnn_internal_test_symbols && 'windows-x86_64-htp-simulator' || '' }}"
  # Materialize for step-level `if` checks: GitHub Actions does not allow `env`/`secrets`
  # contexts in job-level `if`, so jobs gate on `github.event.pull_request.head.repo.fork`
  # while steps gate on `env.BUILD_ARTIFACTORY_REPO != ''`. Both signals skip Artifactory
  # work on fork PRs (where this secret is empty).
  BUILD_ARTIFACTORY_REPO: "${{ secrets.BUILD_ARTIFACTORY_REPO }}"

  BUILD_SOURCEBRANCH: "${{ github.ref }}"
  BUILD_SOURCEVERSION: "${{ github.sha }}"
  BUILD_BUILDID: "${{ github.run_id }}"

jobs:
  build:
    name: "build-${{inputs.target_os}}-${{inputs.target_arch}}${{ inputs.qnn_internal_test_symbols && '-internal-symbols' || '' }}-py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}"
    runs-on: ["self-hosted", "${{ inputs.build_runner_os != '' && inputs.build_runner_os || inputs.target_os }}", "${{ inputs.build_runner_arch }}", "Build"]
    defaults:
      run:
        shell: "${{ inputs.target_os == 'windows' && 'cmd' || 'bash' }}"
    steps:
      - uses: actions/checkout@v6
        # Submodules omitted here; initialized below only when a heavy build is needed, so
        # has_code_changes=false jobs skip the expensive recursive fetch while still reporting green.
      - name: Validate internal-symbol artifact settings
        if: ${{ inputs.qnn_internal_test_symbols && (inputs.upload_test_archive || inputs.upload_wheel || inputs.upload_nuget || inputs.upload_archive || inputs.build_pdb_archive || inputs.upload_pdb_archive || inputs.upload_aar) }}
        run: |
          echo "::error::Internal-symbol builds must not publish test or production artifacts."
          exit 1

      - name: Initialize submodules
        if: ${{ inputs.has_code_changes }}
        run: git submodule update --init --recursive

      - name: Build ${{inputs.target_os}} ${{ inputs.target_arch }} py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}
        if: ${{ inputs.has_code_changes }}
        run: >
          "${{ inputs.target_os == 'windows' && 'python.exe' || 'python3' }}"
          qcom/build_and_test.py
          --target-py-version ${{inputs.target_py_vsn}}
          --config ${{ inputs.build_config }}
          ${{ inputs.build_nuget == true && '--build-nuget' || '' }}
          ${{ inputs.build_archive == true && '--build-archive' || '' }}
          ${{ inputs.build_aar == true && '--build-aar' || '' }}
          ${{ inputs.upload_test_archive && 'archive' || 'build' }}_ort_${{inputs.target_os}}_${{ inputs.target_arch }}${{ inputs.qnn_internal_test_symbols && '_internal_symbols' || '' }}

      # Preserve executable modes and symlinks in the temporary cross-runner
      # hand-off. The existing archive accept-list excludes build intermediates.
      - name: Pack Linux internal-symbol test inputs
        if: ${{ inputs.has_code_changes && inputs.target_os == 'linux' && inputs.qnn_internal_test_symbols && inputs.run_tests && !inputs.build_test_same_runner }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'qcom/scripts/all')
          from archive_tests import archive_linux
          archive_linux('linux-${{ env.BUILD_DIR_ARCH }}', '${{ inputs.build_config }}')
          PY

      - name: Upload Linux internal-symbol test inputs
        if: ${{ inputs.has_code_changes && inputs.target_os == 'linux' && inputs.qnn_internal_test_symbols && inputs.run_tests && !inputs.build_test_same_runner }}
        uses: actions/upload-artifact@v7
        with:
          name: qnn-internal-${{ inputs.target_os }}-${{ inputs.target_arch }}-test-inputs
          retention-days: 1
          path: ${{ github.workspace }}/build/onnxruntime-tests-${{ inputs.build_config != 'Release' && format('{0}-', inputs.build_config) || '' }}linux-${{ env.BUILD_DIR_ARCH }}.tar.bz2
          if-no-files-found: error

      - name: Setup JFrog CLI
        if: ${{ inputs.has_code_changes && env.BUILD_ARTIFACTORY_REPO != '' && (env.SNAPSHOT_GOLDEN_PROFILE == '' || (inputs.run_tests && inputs.build_test_same_runner)) }}
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      - name: Enable aligned snapshot goldens
        if: ${{ inputs.has_code_changes && inputs.run_tests && inputs.build_test_same_runner && env.SNAPSHOT_GOLDEN_PROFILE != '' && env.BUILD_ARTIFACTORY_REPO != '' }}
        shell: powershell
        run: |
          $gitBash = Join-Path $env:ProgramW6432 "Git\bin\bash.exe"
          if (-not (Test-Path -LiteralPath $gitBash)) {
            throw "Git Bash was not found under $gitBash"
          }

          $buildDir = "build/windows-$env:BUILD_DIR_ARCH/$env:BUILD_CONFIG_DIR"
          $goldenDir = "build/windows-$env:BUILD_DIR_ARCH/snapshot-goldens"
          $env:PYTHON_BIN = "python.exe"
          & $gitBash qcom/scripts/all/prepare_snapshot_goldens.sh `
            "--build-dir=$buildDir" `
            "--golden-dir=$goldenDir" `
            "--golden-profile=$env:SNAPSHOT_GOLDEN_PROFILE"
          if ($LASTEXITCODE -ne 0) {
            throw "Snapshot-golden preflight failed (exit $LASTEXITCODE)."
          }

      - name: Test ${{inputs.target_os}} ${{ inputs.target_arch }} py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}
        if: ${{ inputs.has_code_changes && inputs.run_tests && inputs.build_test_same_runner }}
        run: >
          "${{ inputs.target_os == 'windows' && 'python.exe' || 'python3' }}"
          qcom/build_and_test.py
          --target-py-version ${{inputs.target_py_vsn}}
          --config ${{ inputs.build_config }}
          test_ort_${{inputs.target_os}}_${{inputs.target_arch}}${{ inputs.qnn_internal_test_symbols && '_internal_symbols' || '' }} --only

      - name: Verify snapshot-golden accuracy routing
        if: ${{ inputs.has_code_changes && inputs.run_tests && inputs.build_test_same_runner && env.SNAPSHOT_GOLDEN_PROFILE != '' && env.BUILD_ARTIFACTORY_REPO != '' }}
        shell: powershell
        run: |
          $usingFullAccuracyFallback = -not $env:QNN_UT_SNAPSHOT_GOLDEN_DIR
          if ($usingFullAccuracyFallback) {
            Write-Warning "Aligned snapshot goldens were unavailable; verifying the full-accuracy fallback."
          }

          $summary = Join-Path `
            "build/windows-$env:BUILD_DIR_ARCH/$env:BUILD_CONFIG_DIR" `
            "snapshot_accuracy_results/accuracy_gate_summary.txt"
          $accuracyResults = Join-Path `
            "build/windows-$env:BUILD_DIR_ARCH/$env:BUILD_CONFIG_DIR" `
            "snapshot_accuracy_results/accuracy_results.json"
          & python.exe qcom/scripts/all/verify_accuracy_routing.py `
            "--summary=$summary" `
            "--accuracy-results=$accuracyResults"
          if ($LASTEXITCODE -ne 0) {
            throw "Snapshot/accuracy routing verification failed (exit $LASTEXITCODE)."
          }

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        # Skipped on fork PRs: the action creates a check run, which the fork-PR GITHUB_TOKEN cannot do.
        if: ${{ always() && inputs.has_code_changes && inputs.run_tests && inputs.build_test_same_runner && github.event.pull_request.head.repo.fork != true }}
        with:
          check_name: ${{inputs.target_os}}-${{inputs.target_arch}}${{ inputs.qnn_internal_test_symbols && '-internal-symbols' || '' }}-py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}-test-results
          group_reports: false
          include_passed: true
          detailed_summary: true
          verbose_summary:  false
          report_paths: |
            ${{ github.workspace }}/build/${{inputs.target_os}}-${{env.BUILD_DIR_ARCH}}/${{ env.BUILD_CONFIG_DIR }}/*.results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.has_code_changes && inputs.run_tests && inputs.build_test_same_runner }} # always run even if the previous step fails
        with:
          name: ORT ${{inputs.target_os}} ${{inputs.target_arch}}${{ inputs.qnn_internal_test_symbols && '-internal-symbols' || '' }} py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}} Test Results
          retention-days: 7
          path: |
            ${{ github.workspace }}/build/${{inputs.target_os}}-${{env.BUILD_DIR_ARCH}}/${{ env.BUILD_CONFIG_DIR }}/*.results.xml

      # Artifactory steps are no-ops on fork PRs (secrets unavailable); the build still compiles the change.
      - name: Upload Test Archive to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_test_archive && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{inputs.target_py_vsn}}-tests"
          src_pattern: "onnxruntime-tests-${{ inputs.build_config != 'Release' && format('{0}-', inputs.build_config) || '' }}${{inputs.target_os}}-${{ inputs.target_arch }}.${{ env.TEST_ARCHIVE_EXT }}"

      - name: Upload Wheel to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_wheel && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{inputs.target_py_vsn}}-wheels"
          src_pattern: "${{ inputs.target_os }}-${{ inputs.target_arch }}/${{ env.BUILD_CONFIG_DIR }}/dist/onnxruntime_qnn*.whl"

      - name: Upload NuGet to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_nuget && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{ inputs.target_py_vsn }}-nuget"
          src_pattern: "${{inputs.target_os}}-${{ inputs.target_arch }}/${{ env.BUILD_CONFIG_DIR }}/dist/Qualcomm.ML.OnnxRuntime.QNN*.nupkg"

      - name: Upload Archive to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_archive && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{ inputs.target_py_vsn }}-${{ inputs.build_config != 'Release' && format('{0}-', inputs.build_config) || '' }}${{ inputs.target_os == 'linux' && 'tgz' || 'zip' }}"
          src_pattern: "${{inputs.target_os}}-${{ inputs.target_arch }}/${{ env.BUILD_CONFIG_DIR }}/dist/onnxruntime-qnn*.${{ inputs.target_os == 'linux' && 'tgz' || 'zip' }}"

      - name: Upload AAR to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_aar && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{inputs.target_os}}-${{ inputs.target_arch }}-aar"
          src_pattern: "${{inputs.target_os}}-${{ inputs.target_arch }}/${{ env.BUILD_CONFIG_DIR }}/java/build/android-qnn-ep/outputs/aar/onnxruntime-android-qnn.aar"

      - name: Upload POM to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_aar && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{inputs.target_os}}-${{ inputs.target_arch }}-pom"
          src_pattern: "${{inputs.target_os}}-${{ inputs.target_arch }}/${{ env.BUILD_CONFIG_DIR }}/java/build/android-qnn-ep/outputs/aar/onnxruntime-android-qnn.pom"

      - name: Build Windows ${{ inputs.target_arch }} PDB Archive
        if: ${{ inputs.has_code_changes && inputs.build_pdb_archive && inputs.target_os == 'windows' }}
        run: >
          python.exe tools/ci_build/pkg_assets.py
          --source_dir ${{ github.workspace }}
          --build_dir ${{ github.workspace }}/build/${{ inputs.target_os }}-${{ inputs.target_arch }}
          --config Release
          --pdb_only
          --target_arch ${{ inputs.target_arch }}
          ${{ env.BUILD_CONFIG_DIR == 'Release' && '--use_ninja' || '' }}
          ${{ env.ORT_VERSION_SUFFIX != '' && format('--version_suffix {0}', env.ORT_VERSION_SUFFIX) || '' }}

      - name: Upload PDB Archive to Artifactory
        if: ${{ inputs.has_code_changes && inputs.upload_pdb_archive && inputs.target_os == 'windows' && env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{ inputs.target_py_vsn }}-pdb-zip"
          src_pattern: "${{inputs.target_os}}-${{ inputs.target_arch }}/${{ env.BUILD_CONFIG_DIR }}/dist/onnxruntime-qnn-*-win-*-pdb.zip"

      - name: Prune Docker leftovers
        if: ${{ always() && inputs.target_os == 'linux' }}
        continue-on-error: true
        run: |
          df -h /var . || true
          docker image prune -f
          docker builder prune -f --filter until=72h

  test:
    name: "test-${{inputs.target_os}}-${{inputs.target_arch}}${{ inputs.target_os == 'windows' && inputs.target_arch == 'arm64' && inputs.run_tests && inputs.upload_test_archive && !inputs.build_test_same_runner && '-self-hosted' || '' }}${{ inputs.qnn_internal_test_symbols && '-internal-symbols' || '' }}-py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}"
    # Cross-runner test stage requires Artifactory hand-off from build; skip on fork PRs where secrets are unavailable.
    if: ${{ inputs.run_tests && !inputs.build_test_same_runner && github.event.pull_request.head.repo.fork != true }}
    needs: [build]
    runs-on: ["self-hosted", "${{inputs.target_os}}", "${{ inputs.test_runner_arch }}", "Test"]
    defaults:
      run:
        shell: "${{ inputs.target_os == 'windows' && 'cmd' || 'bash' }}"
    steps:
      - uses: actions/checkout@v6
        # Submodules omitted here; initialized below only when a heavy test run is needed.
      - name: Initialize submodules
        if: ${{ inputs.has_code_changes }}
        run: git submodule update --init --recursive

      - name: Setup JFrog CLI
        if: ${{ inputs.has_code_changes && (!inputs.qnn_internal_test_symbols || inputs.testdata_archive_artifact_name != '') }}
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      - name: Download Tests from Artifactory
        if: ${{ inputs.has_code_changes && !inputs.qnn_internal_test_symbols }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{inputs.target_py_vsn}}-tests"

      - name: Download Linux internal-symbol test inputs
        if: ${{ inputs.has_code_changes && inputs.target_os == 'linux' && inputs.qnn_internal_test_symbols }}
        uses: actions/download-artifact@v4
        with:
          name: qnn-internal-${{ inputs.target_os }}-${{ inputs.target_arch }}-test-inputs
          path: ${{ github.workspace }}/build/

      - name: Extract Linux internal-symbol test inputs
        if: ${{ inputs.has_code_changes && inputs.target_os == 'linux' && inputs.qnn_internal_test_symbols }}
        run: |
          tar -xjf "build/onnxruntime-tests-${{ inputs.build_config != 'Release' && format('{0}-', inputs.build_config) || '' }}linux-${{ env.BUILD_DIR_ARCH }}.tar.bz2"

      - name: Download testdata from Artifactory
        if: ${{ inputs.has_code_changes && inputs.testdata_archive_artifact_name != '' }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: ${{ inputs.testdata_archive_artifact_name }}

      - name: Extract Linux internal-symbol testdata
        if: ${{ inputs.has_code_changes && inputs.target_os == 'linux' && inputs.qnn_internal_test_symbols && inputs.testdata_archive_artifact_name != '' }}
        run: >
          python3 qcom/scripts/all/extract_testdata.py
          --target-platform linux-${{ env.BUILD_DIR_ARCH }}
          --config ${{ inputs.build_config }}
          --archive build/onnxruntime-testdata.tar.bz2

      - name: Test ${{inputs.target_os}} ${{inputs.target_arch}} py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}
        if: ${{ inputs.has_code_changes && !inputs.qnn_internal_test_symbols }}
        run: >
          "${{ inputs.target_os == 'windows' && 'python.exe' || 'python3' }}"
          qcom/build_and_test.py
          --config ${{ inputs.build_config }}
          create_venv
          extract_ort_${{inputs.target_os}}_${{inputs.target_arch}}
          test_ort_${{inputs.target_os}}_${{inputs.target_arch}} --only

      - name: Test Linux ARM64 QNN internal-symbol build
        if: ${{ inputs.has_code_changes && inputs.target_os == 'linux' && inputs.qnn_internal_test_symbols }}
        run: >
          python3 qcom/build_and_test.py
          --target-py-version ${{ inputs.target_py_vsn }}
          --config ${{ inputs.build_config }}
          create_venv
          test_ort_linux_${{ inputs.target_arch }}_internal_symbols --only

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ always() && inputs.has_code_changes }} # always run even if the previous step fails
        with:
          check_name: ${{inputs.target_os}}-${{inputs.target_arch}}${{ inputs.qnn_internal_test_symbols && '-internal-symbols' || '' }}-py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}-test-results
          group_reports: false
          include_passed: true
          detailed_summary: true
          verbose_summary:  false
          report_paths: |
            ${{ github.workspace }}/build/${{inputs.target_os}}-${{env.BUILD_DIR_ARCH}}/${{ env.BUILD_CONFIG_DIR }}/*.results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.has_code_changes }} # always run even if the previous step fails
        with:
          name: ORT ${{inputs.target_os}} ${{inputs.target_arch}}${{ inputs.qnn_internal_test_symbols && '-internal-symbols' || '' }} py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}} Test Results
          retention-days: 7
          path: |
            ${{ github.workspace }}/build/${{inputs.target_os}}-${{env.BUILD_DIR_ARCH}}/${{ env.BUILD_CONFIG_DIR }}/*.results.xml

  test-windows-arm64-qdc:
    if: ${{ inputs.target_os == 'windows' && inputs.target_arch == 'arm64' && inputs.run_tests && inputs.upload_test_archive && !inputs.build_test_same_runner && !inputs.qnn_internal_test_symbols && github.event.pull_request.head.repo.fork != true }}
    needs: [build]
    uses: ./.github/workflows/qualcomm-internal-qdc-test.yml
    secrets: inherit
    with:
      has_code_changes: ${{ inputs.has_code_changes }}
      target_os: windows
      target_arch: arm64
      target_py_vsn: ${{ inputs.target_py_vsn }}
      build_config: ${{ inputs.build_config }}
      testdata_archive_artifact_name: ${{ inputs.testdata_archive_artifact_name }}

  windows-arm64-validation:
    # Preserve the existing Windows ARM64 test check name, now covering both devices.
    name: "test-windows-arm64-py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}"
    if: ${{ always() && inputs.target_os == 'windows' && inputs.target_arch == 'arm64' && inputs.run_tests && inputs.upload_test_archive && !inputs.build_test_same_runner && !inputs.qnn_internal_test_symbols && github.event.pull_request.head.repo.fork != true }}
    needs: [build, test, test-windows-arm64-qdc]
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    timeout-minutes: 5
    steps:
      - name: Require self-hosted and QDC Windows ARM64 tests
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SELF_HOSTED_RESULT: ${{ needs.test.result }}
          QDC_RESULT: ${{ needs.test-windows-arm64-qdc.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ] || [ "$SELF_HOSTED_RESULT" != "success" ] || [ "$QDC_RESULT" != "success" ]; then
            echo "::error::Windows ARM64 validation failed: build=$BUILD_RESULT self-hosted=$SELF_HOSTED_RESULT QDC=$QDC_RESULT"
            exit 1
          fi

  test-wheel:
    name: "test-${{inputs.target_os}}-${{inputs.target_arch}}-py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}}-wheel-smoke"
    # Wheel smoke test downloads the wheel from Artifactory, so it cannot run on an untrusted fork PR.
    if: ${{ inputs.test_wheel && github.event.pull_request.head.repo.fork != true }}
    needs: [build]
    runs-on: ["self-hosted", "${{inputs.target_os}}", "${{ inputs.test_runner_arch }}", "Test"]
    defaults:
      run:
        shell: "${{ inputs.target_os == 'windows' && 'cmd' || 'bash' }}"
    steps:
      - uses: actions/checkout@v6
        # Submodules omitted here; initialized below only when a heavy wheel smoke test is needed.
      - name: Initialize submodules
        if: ${{ inputs.has_code_changes }}
        run: git submodule update --init --recursive

      - name: Setup JFrog CLI
        if: ${{ inputs.has_code_changes }}
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      - name: Download Wheel from Artifactory
        if: ${{ inputs.has_code_changes }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-py${{inputs.target_py_vsn}}-wheels"

      - name: Test ${{inputs.target_os}} ${{inputs.target_arch}} py${{ inputs.target_py_vsn != 'None' && inputs.target_py_vsn || 'none'}} Wheel
        if: ${{ inputs.has_code_changes }}
        run: >
          "${{ inputs.target_os == 'windows' && 'python.exe' || 'python3' }}"
          qcom/build_and_test.py
          --target-py-version ${{inputs.target_py_vsn}}
          --config ${{ inputs.build_config }}
          create_venv
          test_ort_${{inputs.target_os}}_${{inputs.target_arch}}_pysmoke
          test_ort_${{inputs.target_os}}_${{inputs.target_arch}}_pygpu --only
