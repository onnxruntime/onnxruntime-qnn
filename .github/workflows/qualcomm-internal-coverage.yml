name: Qualcomm Internal Coverage

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_call:
  workflow_dispatch:

jobs:
  coverage-linux-x86_64:
    name: "coverage-linux-x86_64"
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules omitted here; initialized below only when coverage is needed.

      - name: Check if coverage is needed
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          elif git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -q 'onnxruntime/core/providers/qnn/'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Initialize submodules
        if: steps.gate.outputs.run == 'true'
        run: git submodule update --init --recursive

      - name: Run Coverage and Diff Coverage (Linux x86_64, always RelWithDebInfo)
        if: steps.gate.outputs.run == 'true'
        run: |
          # Python version does not affect C++ code coverage results.
          # 3.10 matches DEFAULT_PYTHON_LINUX in qcom/ep_build/util.py.
          python3 qcom/build_and_test.py \
            --target-py-version 3.10 \
            diff_coverage_linux_x86_64

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: "coverage-linux-x86_64-${{ github.sha }}"
          retention-days: 3
          path: |
            build/linux-x86_64/RelWithDebInfo/coverage/coverage_lcov_filtered.info
            build/linux-x86_64/RelWithDebInfo/coverage/README.md
            build/linux-x86_64/RelWithDebInfo/coverage/diff-coverage.html
            build/linux-x86_64/RelWithDebInfo/coverage/diff-coverage.txt

      - name: Show Diff Coverage Summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          txt=build/linux-x86_64/RelWithDebInfo/coverage/diff-coverage.txt
          if [ -f "${txt}" ]; then
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            cat "${txt}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Post Diff Coverage to PR
        if: always() && steps.gate.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const txtPath = 'build/linux-x86_64/RelWithDebInfo/coverage/diff-coverage.txt';
            if (!fs.existsSync(txtPath)) {
              console.log('diff-coverage.txt not found, skipping PR comment.');
              return;
            }
            const txt = fs.readFileSync(txtPath, 'utf8');

            const marker = '<!-- diff-coverage-report -->';
            const body = `${marker}\n## Diff Coverage\n\`\`\`\n${txt}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
