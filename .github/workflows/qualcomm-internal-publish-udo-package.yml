#
# Builds and publishes the QNN UDO test op-package fixture (qcom/scripts/linux/build_udo_test_package.py)
# to Artifactory, keyed on the pinned QAIRT SDK version (qcom/packages.yml:qairt.version). This is
# the only place the ~17 GB LLVM + Hexagon SDK toolchain is fetched -- ORT builds now download the
# ~4 MB published artifact instead (see qualcomm-internal-build-and-test-single-os.yml).
#
# On a schedule, also runs a full Linux x86_64 Ubuntu 22.04 build+test using the just-built fixture,
# so an SDK-side ABI break (the #772 class of bug) surfaces here before anyone bumps `qairt:`,
# instead of in an unrelated PR. Re-run manually (workflow_dispatch) whenever `qairt:` is bumped.

name: Qualcomm Internal Publish UDO Test Package

permissions:
  contents: read

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 10 * * 1"  # Every Monday at 3am in San Diego/PDT (10am UTC)

env:
  BUILD_ARTIFACTORY_REPO: "${{ secrets.BUILD_ARTIFACTORY_REPO }}"

jobs:
  publish-udo-package:
    name: publish-udo-package
    runs-on: ["self-hosted", "linux", "X64", "Build"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Build UDO test package
        run: python3 qcom/scripts/linux/build_udo_test_package.py

      - name: Setup JFrog CLI
        if: ${{ env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      - name: Publish UDO test package to Artifactory
        if: ${{ env.BUILD_ARTIFACTORY_REPO != '' }}
        uses: ./.github/actions/upload-tool-artifact
        with:
          name: qnn-udo-test-package
          src_pattern: "qnn-udo-test-package/*"

      # Restores, on a schedule, the coverage that PR CI loses by consuming a prebuilt fixture
      # instead of building it from source on every PR: proof that the SDK's own
      # generate -> build -> register path still works against the pinned QAIRT SDK.
      - name: Build ONNX Runtime for Linux x86_64 Ubuntu 22.04 (verification)
        if: ${{ github.event_name == 'schedule' }}
        run: >
          python3 qcom/build_and_test.py
          --target-py-version 3.12
          --config Release
          build_ort_linux_x86_64_ubuntu_22_04

      - name: Run QNN UDO unit tests against the freshly built fixture (verification)
        if: ${{ github.event_name == 'schedule' }}
        run: >
          python3 qcom/build_and_test.py
          --target-py-version 3.12
          --config Release
          test_ort_linux_x86_64_ubuntu_22_04 --only

      - name: Assert UDO fixture was actually exercised, not skipped (verification)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          results="build/linux-x86_64_ubuntu_22_04/Release"
          for name in UDO_Op_MyAdd; do
            matches=$(grep -l "name=\"${name}\"" "${results}"/*.results.xml 2>/dev/null || true)
            if [ -z "${matches}" ]; then
              echo "::error::No test results found for *.${name} -- results.xml missing or renamed?"
              exit 1
            fi
            if grep -q "<skipped" ${matches}; then
              echo "::error::${name} was SKIPPED, not run. The UDO test package fixture is missing or the HTP simulator is unusable on this runner."
              exit 1
            fi
          done

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ always() && github.event_name == 'schedule' }}
        with:
          check_name: publish-udo-package-verification-results
          group_reports: false
          include_passed: true
          detailed_summary: true
          verbose_summary: false
          report_paths: |
            ${{ github.workspace }}/build/linux-x86_64_ubuntu_22_04/Release/*.results.xml
