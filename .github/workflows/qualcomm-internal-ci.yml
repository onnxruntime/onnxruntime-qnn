name: Qualcomm Internal PR Workflow

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main, rel-*, rel/**/*]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, rel-*, rel/**/*]
  merge_group:
    types: [checks_requested]

  # Allow this workflow to be run manually from the Actions tab
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository containing source to test (maintainer-triggered runs only)
        required: false
        type: string
      source_ref:
        description: Full 40-character commit SHA of the source to test (maintainer-triggered runs only)
        required: false
        type: string
      device_tests_only:
        description: Run only the Android and Qualcomm Linux QDC paths
        required: false
        default: false
        type: boolean

# only one active job per PR. this will cause jobs to be immediately cancelled on subsequent pushes in PRs.
# ref: https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test-all:
    name: Build & Test
    # Draft PRs don't auto-trigger CI: push to a draft runs nothing. CI fires when the PR is
    # marked ready-for-review, or on manual workflow_dispatch. Drafts can't merge, so skipping
    # their (required) checks blocks nothing. Non-PR events (push/merge_group/dispatch) always run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: ./.github/workflows/qualcomm-internal-build-and-test.yml
    secrets: inherit
    with:
      do_all: ${{ !inputs.device_tests_only }}
      do_device_tests: ${{ inputs.device_tests_only }}
      report_device_result_to_source: ${{ inputs.device_tests_only }}
      source_repository: ${{ inputs.source_repository || github.repository }}
      source_ref: ${{ inputs.source_ref || github.sha }}

  coverage:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    uses: ./.github/workflows/qualcomm-internal-coverage.yml
    secrets: inherit

  asan:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    uses: ./.github/workflows/qualcomm-internal-asan.yml
    secrets: inherit
