name: Qualcomm Internal PR Sanity

permissions:
  contents: read
  checks: write

on:
  workflow_call:

jobs:
  sanity-lint:
    name: sanity-lint
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Linting Tool
        run: |
          python3 qcom/build_and_test.py lint

      - name: Run QNN Linux script tests
        run: |
          venv/bin/python -m pytest qcom/scripts/linux/tests -q
