name: "[TEMP][DO NOT MERGE] Validate PR #975 Windows Golden Producer"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

jobs:
  windows-x86-golden-publish-validation:
    name: "PR #975 Windows x86 golden producer dry run"
    uses: ./.github/workflows/qualcomm-internal-snapshot-golden-publish.yml
    secrets: inherit
    with:
      repo_subpath: ci/qnn-ep-test-store/snapshot-goldens-pr975-validation
      golden_profile: windows-x86_64-htp-simulator
      runner_labels: '["self-hosted", "X64", "Windows", "Build"]'
      build_task: build_ort_windows_x86_64_internal_symbols
      build_dir: build/windows-x86_64-internal-symbols
      build_config: Release
      python_executable: python.exe
      dry_run: true
