name: Qualcomm Internal Tests on QDC

permissions:
  contents: read
  checks: write

on:
  workflow_call:
    inputs:
      has_code_changes:
        description: |
          If false, the job runs checkout only and skips ALL heavy work (submodule init,
          Artifactory downloads, the QDC device test), reporting success so the required status
          check stays green on PRs that don't touch code and no QDC device slot is consumed.
          Defaults to true so release callers and direct workflow_dispatch are unaffected.
        default: true
        type: boolean
      target_os:
        default: android
        type: string
      target_arch:
        default: aarch64
        type: string
      testdata_archive_artifact_name:
        description: |
          Artifact name to download as the testdata archive before running QDC tests.
          Empty disables the download.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      target_os:
        description: "The OS for which to build: android or linux"
        default: android
        type: string
      target_arch:
        description: |
          The architecture for which to build.
          [Android] aarch64
          [Linux] aarch64_oe_gcc11_2.
        default: aarch64
        type: string

env:
  # The QDC results folder is a bit odd
  QDC_RESULTS_ARCH: "${{ (inputs.target_os == 'linux' && inputs.target_arch == 'aarch64_oe_gcc11_2') && 'qualcomm_linux' || 'android' }}"
  BUILD_ARTIFACTORY_REPO: "${{ secrets.BUILD_ARTIFACTORY_REPO }}"

jobs:
  # Fork PRs cannot access Artifactory secrets or the QDC API token, so the real test job is skipped for them.
  # This stub carries the same `name:` and runs only on fork PRs so branch protection sees a green check.
  test-fork-stub:
    name: "test-${{inputs.target_os}}-${{inputs.target_arch}}-pynone"
    if: ${{ github.event.pull_request.head.repo.fork == true }}
    runs-on: ["self-hosted", "linux", "X64", "Build"]
    timeout-minutes: 10
    steps:
      - run: echo "QDC device tests skipped on fork PRs (need hardware + Artifactory secrets); change is still compiled, full device suite runs post-merge on main."
        shell: bash

  test:
    name: "test-${{inputs.target_os}}-${{inputs.target_arch}}-pynone"
    # QDC tests pull artifacts from Artifactory; fork stub above handles the fork case.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    runs-on: ["self-hosted", "Linux", "QDC"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        # Submodules omitted here; initialized below only when a heavy QDC run is needed.
      - name: Initialize submodules
        if: ${{ inputs.has_code_changes }}
        run: git submodule update --init --recursive

      - name: Setup JFrog CLI
        if: ${{ inputs.has_code_changes }}
        uses: jfrog/setup-jfrog-cli@v5
        with:
          disable-auto-build-publish: true
          disable-job-summary: true
        env:
          JF_URL: ${{ secrets.BUILD_ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.BUILD_ARTIFACTORY_TOKEN }}

      - name: Download Tests from Artifactory
        if: ${{ inputs.has_code_changes }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: "${{ inputs.target_os }}-${{ inputs.target_arch }}-pyNone-tests"

      - name: Download testdata from Artifactory
        if: ${{ inputs.has_code_changes && inputs.testdata_archive_artifact_name != '' }}
        uses: ./.github/actions/download-ci-artifact
        with:
          name: ${{ inputs.testdata_archive_artifact_name }}

      - name: Test ${{inputs.target_os}} ${{inputs.target_arch}} pynone
        if: ${{ inputs.has_code_changes }}
        env:
          QDC_API_TOKEN: ${{ secrets.QDC_API_TOKEN }}
        # Use exec so that workflow cancel signals are sent directly to build_and_test.py, which will then
        # forward them to qdc_runner.py and in-flight jobs can be aborted to preserve our QDC slots and
        # not leak huge files on the runner.
        run: >
          exec python3 qcom/build_and_test.py
          create_qdc_venv
          test_ort_qdc_${{inputs.target_os}}_${{inputs.target_arch}} --only

      - name: Cleanup QDC Runner tmp files
        if: ${{ always() && inputs.has_code_changes }}
        run: |
          echo "Cleaning $TMPDIR/QdcRunner-*"
          rm -fr $TMPDIR/QdcRunner-*

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: ${{ always() && inputs.has_code_changes }} # always run even if the previous step fails
        with:
          check_name: ${{inputs.target_os}}-${{inputs.target_arch}}-pynone-test-results
          group_reports: false
          include_passed: true
          detailed_summary: true
          verbose_summary:  false
          report_paths: |
            ${{ github.workspace }}/build/qdc-${{ env.QDC_RESULTS_ARCH }}/*.results.xml

      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.has_code_changes }} # always run even if the previous step fails
        with:
          name: ORT ${{inputs.target_os}} ${{inputs.target_arch}} pynone Test Results
          path: |
            ${{ github.workspace }}/build/qdc-${{ env.QDC_RESULTS_ARCH }}/*.results.xml
            ${{ github.workspace }}/build/qdc-${{ env.QDC_RESULTS_ARCH }}/*.txt
